name: Tests

on:
  push:
  pull_request:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the scripts with mawk and GNU tools, macOS with BSD awk and tools:
        # the projects that use the harness run on both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: tests/run.sh
